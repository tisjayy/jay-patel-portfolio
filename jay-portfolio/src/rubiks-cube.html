<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubik's Cube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #fff; font-family: sans-serif; font-size: 1.4rem; z-index: 100;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #solved-message {
      display: none; position: fixed; top: 24px;
      left: 50%; transform: translateX(-50%);
      background: rgba(0,255,100,0.15); color: #00ff64;
      font-family: sans-serif; font-size: 2rem; font-weight: bold;
      padding: 14px 36px; border-radius: 14px;
      border: 2px solid #00ff64; z-index: 100; pointer-events: none;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateX(-50%) translateY(-10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.4); font-family: sans-serif; font-size: 0.85rem;
      pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Loading Rubik's Cube...</span>
  </div>
  <div id="solved-message">🎉 Solved!</div>
  <div id="hint">Drag a face to rotate a layer &nbsp;·&nbsp; Drag empty space to orbit</div>
  <canvas id="canvas"></canvas>

  <!-- AI Solver Panel -->
  <div id="ai-panel">
    <div id="ai-title-bar">&#9632; AI Solver</div>
    <div id="ai-panel-body">
      <div id="ai-status-bar">Initializing…</div>
      <div id="ai-btn-row">
        <button id="ai-solve-btn" class="win-btn" onclick="window._triggerAISolve()" disabled>Solve</button>
        <button id="ai-scramble-btn" class="win-btn" onclick="window._triggerScramble()" style="display:none">Scramble</button>
      </div>
    </div>
  </div>

  <style>
    #ai-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #d4d0c8;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 1px 1px 0 #000000;
      font-family: 'Tahoma', 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      min-width: 150px;
      z-index: 50;
      color: #000;
    }
    #ai-title-bar {
      background: linear-gradient(to right, #000080, #1080c8);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 6px;
      letter-spacing: 0.01em;
    }
    #ai-panel-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #ai-status-bar {
      background: #fff;
      border: 1px solid;
      border-color: #808080 #dfdfdf #dfdfdf #808080;
      padding: 2px 5px;
      font-size: 11px;
      min-height: 18px;
    }
    #ai-btn-row {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .win-btn {
      background: #d4d0c8;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      padding: 2px 12px;
      font-family: 'Tahoma', 'MS Sans Serif', Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 1px 1px 0 #000;
      min-width: 60px;
      text-align: center;
    }
    .win-btn:active:not(:disabled) {
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: none;
      padding: 3px 11px 1px 13px;
    }
    .win-btn:disabled {
      color: #808080;
      text-shadow: 1px 1px 0 #fff;
      cursor: default;
    }
  </style>

  <script>
    window._aiSolveStatus = function(state, done, total) {
      const btn    = document.getElementById('ai-solve-btn');
      const status = document.getElementById('ai-status-bar');
      const scrambleBtn = document.getElementById('ai-scramble-btn');
      if (state === 'initializing') {
        btn.disabled = true;
        status.textContent = 'Initializing…';
      } else if (state === 'ready') {
        btn.disabled = false;
        status.textContent = 'Ready';
      } else if (state === 'analyzing') {
        btn.disabled = true;
        status.textContent = 'Analyzing…';
      } else if (state === 'solving') {
        btn.disabled = true;
        status.textContent = total ? 'Move ' + done + ' / ' + total : 'Solving…';
      } else if (state === 'done') {
        btn.disabled = false;
        status.textContent = 'Solved!';
        scrambleBtn.style.display = 'inline-block';
      } else if (state === 'already-solved') {
        btn.disabled = false;
        status.textContent = 'Already solved';
      } else if (state === 'error') {
        btn.disabled = false;
        status.textContent = 'Error — try again';
      }
    };

    window._onCubeSolved = function() {
      const scrambleBtn = document.getElementById('ai-scramble-btn');
      const status = document.getElementById('ai-status-bar');
      scrambleBtn.style.display = 'inline-block';
      status.textContent = 'Solved!';
    };

    window._triggerAISolve = function() {
      if (window.cubeApp) window.cubeApp.solveWithAI();
    };

    window._triggerScramble = function() {
      const scrambleBtn = document.getElementById('ai-scramble-btn');
      const status = document.getElementById('ai-status-bar');
      scrambleBtn.style.display = 'none';
      status.textContent = 'Ready';
      if (window.cubeApp) window.cubeApp.scramble();
    };
  </script>
</body>
</html>
